<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Next Rugby Match</title>
  <meta name="description" content="Next men's Saracens or England Rugby match with lineups and preview when available." />
  <meta name="theme-color" content="#090a0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Rugby Next" />
  <link rel="icon" href="assets/rugby-ball-logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <style>
    :root {
      --bg: #090a0c; --surface: #101216; --raised: #15181d; --text: #f2f0eb;
      --muted: #999da5; --quiet: #747982; --accent: #d7192d; --accent-bright: #f02b3e;
      --good: #55b987; --warn: #d9a441; --line: #292d34; --line-soft: #20232a;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 78px; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text); background: var(--bg); padding: 0 24px 56px;
    }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: 3px; z-index: 20; background: var(--accent); }
    main { width: min(1180px, 100%); max-width: 100%; margin: 0 auto; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 98px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .rugby-logo { width: 48px; height: 48px; border-radius: 12px; flex: 0 0 auto; }
    .brand-title { font-family: "Arial Narrow", "Roboto Condensed", ui-sans-serif, system-ui, sans-serif; font-size: 1.15rem; font-weight: 900; letter-spacing: -.03em; }
    .eyebrow, .section-kicker, .ai-kicker, .subhead { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; font-weight: 800; }
    .eyebrow { margin-top: 3px; color: var(--quiet); }
    .section-nav { display: flex; gap: 4px; }
    .section-nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 13px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: .86rem; font-weight: 750; }
    .section-nav a:hover { color: var(--text); background: var(--raised); }
    :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .hero { position: relative; padding: clamp(38px, 7vw, 82px) 0 24px; }
    .hero::after { content: ""; position: absolute; right: 0; top: 36px; width: min(34vw, 380px); height: 1px; background: var(--accent); transform: skewY(-7deg); transform-origin: right; }
    h1, .match, .num, .score { font-family: "Arial Narrow", "Roboto Condensed", ui-sans-serif, system-ui, sans-serif; }
    h1 { max-width: 720px; font-size: clamp(2.8rem, 8vw, 6.5rem); line-height: .86; letter-spacing: -.065em; margin: 12px 0 0; text-transform: uppercase; }
    h2 { margin: 0; font-size: clamp(1.45rem, 3vw, 2.1rem); letter-spacing: -.035em; }
    h3 { margin: 0; }
    .card, .section-shell { max-width: 100%; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 18px 50px rgba(0,0,0,.22); }
    .card { position: relative; overflow: hidden; padding: clamp(22px, 4vw, 42px); }
    .card::before { content: ""; position: absolute; inset: 0 auto auto 0; width: 86px; height: 4px; background: var(--accent); }
    .section-shell { margin-top: 24px; padding: clamp(20px, 3vw, 32px); }
    .section-head { display: flex; gap: 18px; align-items: end; justify-content: space-between; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .team { display: inline-flex; align-items: center; gap: 9px; color: #d6d8dc; font-size: .82rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
    .dot.warn { background: var(--warn); }
    .match { max-width: 900px; font-size: clamp(2.2rem, 6vw, 5rem); font-weight: 950; line-height: .94; letter-spacing: -.055em; margin: 22px 0 13px; text-transform: uppercase; }
    .meta { color: var(--muted); font-size: 1rem; line-height: 1.6; }
    .meta strong { color: #d8d9dc; }
    .countdown { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; margin: 30px 0; overflow: hidden; }
    .unit { padding: clamp(14px, 3vw, 24px) 10px; text-align: center; background: #0d0f12; border-right: 1px solid var(--line); }
    .unit:last-child { border-right: 0; }
    .num { display: block; font-size: clamp(2rem, 6vw, 4.6rem); line-height: 1; font-weight: 950; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
    .label { color: var(--quiet); text-transform: uppercase; letter-spacing: .1em; font-size: .66rem; font-weight: 800; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
    .panel { min-width: 0; padding: 21px; border: 1px solid var(--line-soft); border-radius: 12px; background: #0d0f12; }
    .panel h2 { font-size: 1.08rem; margin-bottom: 14px; }
    .ai-briefing { position: relative; margin: 10px 0 20px; padding: clamp(22px, 4vw, 34px); border-left: 4px solid var(--accent); background: #181a1f; }
    .ai-briefing::after { content: "FIELD NOTES"; position: absolute; right: 18px; top: 16px; color: #30333a; font: 900 .66rem/1 ui-sans-serif, system-ui; letter-spacing: .13em; }
    .ai-kicker { position: relative; color: #e76672; }
    .ai-copy { max-width: 900px; margin: 13px 0 10px; font-family: Georgia, serif; font-size: clamp(1.12rem, 2.4vw, 1.45rem); line-height: 1.55; }
    .ai-byline { color: var(--quiet); font-size: .8rem; }
    .lineups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .squad { min-width: 0; border-top: 2px solid var(--line); padding-top: 14px; }
    .squad h3 { margin-bottom: 12px; }
    .players { display: grid; }
    .player { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
    .number { color: #e76672; font-weight: 900; }
    .position { color: var(--quiet); font-size: .82rem; }
    .subhead { margin: 14px 0 6px; }
    .pillrow { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { padding: 6px 9px; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); color: var(--text); font-size: .82rem; }
    .footer { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); color: var(--quiet); font-size: .82rem; }
    a { color: #f18892; }
    .empty { margin-top: 14px; padding: 14px; border: 1px dashed #3a3e46; border-radius: 8px; color: var(--muted); }
    .season-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .season-column { min-width: 0; }
    .season-column-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: #d9dade; font-size: .83rem; font-weight: 800; }
    .season-list { border-top: 1px solid var(--line); }
    .season-item { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 13px; align-items: center; min-height: 88px; padding: 13px 10px; border-bottom: 1px solid var(--line); }
    .season-item.next-up { position: relative; background: #191518; border-color: #553038; }
    .season-item.next-up::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent); }
    .season-date { color: var(--muted); font-size: .78rem; line-height: 1.35; }
    .season-opponent { overflow-wrap: anywhere; font-size: 1rem; font-weight: 850; }
    .season-detail { margin-top: 4px; color: var(--quiet); font-size: .76rem; line-height: 1.4; }
    .score { text-align: right; font-size: 1.05rem; font-weight: 900; white-space: nowrap; }
    .result-badge, .form-badge { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 5px; color: #07110a; background: var(--good); font-size: .74rem; font-weight: 950; }
    .result-badge.L, .form-badge.L { color: #fff; background: var(--accent); }
    .result-badge.D, .form-badge.D { color: #111; background: var(--warn); }
    .kickoff { text-align: right; color: #e8e5df; font-size: .82rem; font-weight: 800; white-space: nowrap; }
    .next-label { display: block; margin-bottom: 5px; color: #e76672; font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; }
    .standings-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
    .sarries-summary { display: flex; gap: 18px; align-items: center; justify-content: space-between; margin: 18px 0; padding: 15px 17px; border-left: 3px solid var(--accent); background: #191518; }
    .sarries-summary strong { display: block; font-size: 1.1rem; }
    .sarries-summary .meta { display: block; font-size: .85rem; }
    .form { display: flex; gap: 5px; align-items: center; }
    .table-hint { margin: 10px 0 8px; color: var(--quiet); font-size: .78rem; }
    .table-scroll { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; -webkit-overflow-scrolling: touch; }
    .prem-table { width: 100%; min-width: 760px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .prem-table caption { padding: 12px; color: var(--quiet); text-align: left; font-size: .8rem; }
    .prem-table th, .prem-table td { padding: 11px 9px; border-bottom: 1px solid var(--line-soft); text-align: center; white-space: nowrap; }
    .prem-table th { color: #aeb1b7; background: #0d0f12; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; }
    .prem-table th:nth-child(2), .prem-table td:nth-child(2) { text-align: left; }
    .prem-table tbody tr:last-child td { border-bottom: 0; }
    .prem-table .saracens-row { background: #26181c; font-weight: 850; box-shadow: inset 3px 0 var(--accent); }
    .freshness { margin: 14px 0 0; color: var(--quiet); font-size: .82rem; line-height: 1.5; }
    .stale-copy { color: #e8c678; }
    @media (max-width: 820px) { .grid, .lineups, .season-grid { grid-template-columns: 1fr; } }
    @media (max-width: 620px) {
      body { padding: 0 14px 38px; }
      .masthead { min-height: 78px; }
      .brand-title { font-size: 1rem; }
      .eyebrow { display: none; }
      .rugby-logo { width: 40px; height: 40px; border-radius: 10px; }
      .section-nav a { padding: 0 9px; font-size: .75rem; }
      .section-nav a span { display: none; }
      .hero { padding-top: 38px; }
      .countdown { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .unit { padding: 14px 4px; }
      .section-shell, .card { border-radius: 12px; padding: 18px; }
      .season-item { grid-template-columns: 62px minmax(0, 1fr) auto; gap: 9px; padding-inline: 6px; }
      .score { font-size: .88rem; }
      .sarries-summary { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="brand">
        <img class="rugby-logo" src="assets/rugby-ball-logo.svg" alt="" />
        <div><div class="brand-title">Rugby Command</div><div class="eyebrow">Saracens / England men's tracker</div></div>
      </div>
      <nav class="section-nav" aria-label="Page sections">
        <a href="#next-match"><span>Next&nbsp;</span>Match</a>
        <a href="#season">Season</a>
        <a href="#prem-table"><span>PREM&nbsp;</span>Table</a>
      </nav>
    </header>
    <header class="hero" id="next-match">
      <div class="section-kicker">Live match intelligence</div>
      <h1>Next match</h1>
    </header>
    <section class="card" id="app" aria-live="polite">Loading fixture…</section>
    <section class="section-shell" id="season" aria-live="polite">Loading Saracens season…</section>
    <section class="section-shell" id="prem-table"><div id="standings" aria-live="polite">Loading PREM table…</div></section>
  </main>

  <script>
    const fmtDate = new Intl.DateTimeFormat(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
    });
    const fmtSeasonDate = new Intl.DateTimeFormat(undefined, {
      weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC'
    });
    const fmtKickoff = new Intl.DateTimeFormat(undefined, {
      weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
    const esc = (value = '') => String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

    function parts(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      return { days: Math.floor(s / 86400), hours: Math.floor((s % 86400) / 3600), mins: Math.floor((s % 3600) / 60), secs: s % 60 };
    }

    function renderPlayers(players = []) {
      return `<div class="players">${players.map(p => `
        <div class="player"><span class="number">${esc(p.number)}</span><span>${esc(p.name)}</span><span class="position">${esc(p.position)}</span></div>
      `).join('')}</div>`;
    }

    function renderLineups(lineup) {
      if (!lineup || !lineup.available) {
        return `<section class="panel"><h2><span class="team"><span class="dot warn"></span>Team lineups</span></h2><div class="empty">${esc(lineup?.message || 'Lineups not available yet.')}</div></section>`;
      }
      const teams = Object.entries(lineup.teams || {});
      return `<section class="panel"><h2>Team lineups</h2><div class="lineups">
        ${teams.map(([team, groups]) => `
          <div class="squad">
            <h3>${esc(team)}</h3>
            <div class="subhead">Starting XV</div>
            ${renderPlayers(groups.starters || [])}
            ${(groups.replacements || []).length ? `<div class="subhead">Replacements</div>${renderPlayers(groups.replacements)}` : ''}
          </div>
        `).join('')}
      </div><div class="footer"><span>Lineup source: ${lineup.source_url ? `<a href="${esc(lineup.source_url)}">${esc(lineup.source)}</a>` : esc(lineup.source || '')}</span></div></section>`;
    }

    function renderAiBriefing(briefing) {
      if (!briefing?.text) return '';
      return `<section class="ai-briefing" aria-labelledby="ai-briefing-title">
        <div class="ai-kicker" id="ai-briefing-title">AI pre-match briefing</div>
        <p class="ai-copy">“${esc(briefing.text)}”</p>
        <div class="ai-byline">Strong opinions · no playing experience</div>
      </section>`;
    }

    function renderPreview(preview, tv) {
      return `<section class="panel"><h2>Match preview</h2>
        <p class="meta"><strong>${esc(preview?.title || 'Preview')}</strong><br>${esc(preview?.summary || 'Preview not available yet.')}</p>
        ${preview?.lineup_note ? `<div class="empty">${esc(preview.lineup_note)}</div>` : ''}
        ${tv?.length ? `<div class="subhead">TV / stream</div><div class="pillrow">${tv.map(t => `<span class="pill">${esc(t.country)}: ${esc(t.channel)}</span>`).join('')}</div>` : ''}
        ${preview?.url ? `<div class="footer"><a href="${esc(preview.url)}">Read source / search</a></div>` : ''}
      </section>`;
    }

    function renderSaracensSeason(season) {
      const results = season?.recent_results || [];
      const upcoming = season?.upcoming_fixtures || [];
      if (!season || season.status === 'unavailable') {
        return `<div class="section-head"><div><div class="section-kicker">Club campaign</div><h2>Saracens season</h2></div></div>
          <div class="empty"><strong>Season data unavailable</strong><br>The official Saracens fixture source could not be loaded. The daily updater will try again.</div>`;
      }
      const day = value => fmtSeasonDate.format(new Date(`${value}T12:00:00Z`));
      const resultLabel = value => value === 'W' ? 'Win' : value === 'L' ? 'Loss' : 'Draw';
      const resultItems = results.length ? results.map(item => `
        <article class="season-item">
          <time class="season-date" datetime="${esc(item.date)}">${esc(day(item.date))}<br>${esc(item.home_away)}</time>
          <div><div class="season-opponent">${esc(item.opponent)}</div><div class="season-detail">${esc(item.competition)}${item.venue ? ` · ${esc(item.venue)}` : ''}</div></div>
          <div class="score"><span class="result-badge ${esc(item.result)}" aria-label="${esc(resultLabel(item.result))}">${esc(item.result)}</span><div>${esc(item.score)}</div></div>
        </article>`).join('') : '<div class="empty">No completed senior men’s results are currently published by the source.</div>';
      const fixtureItems = upcoming.length ? upcoming.map((item, index) => `
        <article class="season-item${index === 0 ? ' next-up' : ''}">
          <time class="season-date" datetime="${esc(item.start_utc)}">${esc(day(item.date))}<br>${esc(item.home_away)}</time>
          <div>${index === 0 ? '<span class="next-label">Next up</span>' : ''}<div class="season-opponent">${esc(item.opponent)}</div><div class="season-detail">${esc(item.competition)}${item.venue ? ` · ${esc(item.venue)}` : ''}</div></div>
          <div class="kickoff">${esc(fmtKickoff.format(new Date(item.start_utc)))}<br><span class="season-detail">${esc(item.kickoff_status)}</span></div>
        </article>`).join('') : '<div class="empty">No upcoming senior men’s fixtures are currently published by the source.</div>';
      const freshness = season.stale
        ? `<span class="stale-copy"><strong>Showing the last successful season update.</strong> The latest refresh failed; data retrieved ${esc(fmtDate.format(new Date(season.retrieved_at_utc)))}.</span>`
        : `Official season data retrieved ${esc(fmtDate.format(new Date(season.retrieved_at_utc)))}.`;
      return `<div class="section-head"><div><div class="section-kicker">Club campaign</div><h2>Saracens season</h2></div><div class="form" aria-label="Recent form">${results.map(item => `<span class="form-badge ${esc(item.result)}" aria-label="${esc(resultLabel(item.result))}">${esc(item.result)}</span>`).join('')}</div></div>
        <div class="season-grid">
          <section class="season-column" aria-labelledby="results-title"><div class="season-column-title" id="results-title"><span>Recent results</span><span>${esc(results.length)} / 5</span></div><div class="season-list">${resultItems}</div></section>
          <section class="season-column" aria-labelledby="fixtures-title"><div class="season-column-title" id="fixtures-title"><span>Next five</span><span>${esc(upcoming.length)} / 5</span></div><div class="season-list">${fixtureItems}</div></section>
        </div>
        <p class="freshness">${freshness} <a href="${esc(season.source_url)}">Official Saracens source</a>.</p>`;
    }

    function ordinal(value) {
      const mod100 = value % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${value}th`;
      return `${value}${({1:'st', 2:'nd', 3:'rd'})[value % 10] || 'th'}`;
    }

    function renderPremTable(table) {
      const teams = table?.teams || [];
      if (!teams.length) {
        return `<div class="standings-head"><h2>Current PREM table</h2></div>
          <div class="empty"><strong>Prem table unavailable</strong><br>The official standings could not be loaded. The daily updater will try again.</div>`;
      }
      const saracens = teams.find(row => /saracens/i.test(row.team));
      const form = saracens?.form || [];
      const summary = saracens ? `<div class="sarries-summary" aria-label="Saracens league summary">
        <div><strong>Saracens are ${esc(ordinal(saracens.position))}</strong><span class="meta">${esc(saracens.points)} points · ${esc(saracens.played)} played</span></div>
        <div><div class="subhead">Recent form</div><div class="form">${form.length ? form.map(result => `<span class="form-badge ${esc(result)}" aria-label="${result === 'W' ? 'Win' : result === 'L' ? 'Loss' : 'Draw'}">${esc(result)}</span>`).join('') : '<span class="meta">Not yet available</span>'}</div></div>
      </div>` : '';
      const freshness = table.stale
        ? `<span class="stale-copy"><strong>Showing the last successful update.</strong> The latest refresh failed; standings retrieved ${esc(fmtDate.format(new Date(table.retrieved_at_utc)))}.</span>`
        : `Official standings retrieved ${esc(fmtDate.format(new Date(table.retrieved_at_utc)))}.`;
      return `<div class="standings-head"><h2>Current PREM table</h2><span class="pill">${esc(table.season || '')}</span></div>
        ${summary}
        <p class="table-hint" id="prem-table-hint">Swipe table sideways to see all columns.</p>
        <div class="table-scroll" tabindex="0" role="region" aria-label="PREM league standings; horizontally scrollable" aria-describedby="prem-table-hint">
          <table class="prem-table">
            <caption>${esc(table.competition || 'PREM Rugby')} standings</caption>
            <thead><tr><th scope="col">Pos</th><th scope="col">Team</th><th scope="col">P</th><th scope="col">W</th><th scope="col">D</th><th scope="col">L</th><th scope="col">PD</th><th scope="col">TBP</th><th scope="col">LBP</th><th scope="col">BP</th><th scope="col">Pts</th></tr></thead>
            <tbody>${teams.map(row => `<tr${/saracens/i.test(row.team) ? ' class="saracens-row"' : ''}><td>${esc(row.position)}</td><td>${esc(row.team)}</td><td>${esc(row.played)}</td><td>${esc(row.won)}</td><td>${esc(row.drawn)}</td><td>${esc(row.lost)}</td><td>${row.points_difference > 0 ? '+' : ''}${esc(row.points_difference)}</td><td>${esc(row.try_bonus_points)}</td><td>${esc(row.losing_bonus_points)}</td><td>${esc(row.bonus_points)}</td><td><strong>${esc(row.points)}</strong></td></tr>`).join('')}</tbody>
          </table>
        </div>
        <p class="freshness">${freshness} <a href="${esc(table.source_url)}">Official PREM source</a>.</p>`;
    }

    async function load() {
      const res = await fetch('./fixtures.json', { cache: 'no-store' });
      const data = await res.json();
      document.getElementById('season').innerHTML = renderSaracensSeason(data.saracens_season);
      document.getElementById('standings').innerHTML = renderPremTable(data.prem_table);
      const now = Date.now();
      const next = data.matches
        .map(m => ({...m, date: new Date(m.start_utc)}))
        .filter(m => m.date.getTime() > now - 3 * 60 * 60 * 1000)
        .sort((a,b) => a.date - b.date)[0];

      const app = document.getElementById('app');
      if (!next) {
        app.innerHTML = `<div class="match">No upcoming match found</div><p class="meta">Sources checked, but nothing future-dated is currently available.</p>`;
        return;
      }

      app.innerHTML = `
        <div class="team"><span class="dot"></span>${esc(next.team)}</div>
        <div class="match">${esc(next.title)}</div>
        <div class="meta"><strong>${esc(next.competition)}</strong><br>${esc(next.venue)}<br><span id="kickoff"></span></div>
        <div class="countdown" role="timer">
          ${['days','hours','mins','secs'].map(k => `<div class="unit"><span class="num" id="${k}">—</span><span class="label">${k}</span></div>`).join('')}
        </div>
        ${renderAiBriefing(next.ai_briefing)}
        <div class="grid">
          ${renderPreview(next.preview, next.tv)}
          ${renderLineups(next.lineup)}
        </div>
        ${(data.notes || []).length ? `<div class="empty">${data.notes.map(note => `<div>${esc(note)}</div>`).join('')}</div>` : ''}
        <div class="footer"><span>Updated: ${fmtDate.format(new Date(data.generated_at_utc))}</span><span>Fixture source: ${esc(next.source)}</span></div>`;

      document.getElementById('kickoff').textContent = `Kick-off: ${fmtDate.format(next.date)}`;
      function tick() {
        const p = parts(next.date - new Date());
        for (const [k,v] of Object.entries(p)) document.getElementById(k).textContent = String(v).padStart(2,'0');
      }
      tick(); setInterval(tick, 1000);
    }
    load().catch(err => {
      document.getElementById('app').innerHTML = `<div class="match">Could not load fixture</div><p class="meta">${esc(err.message)}</p>`;
      document.getElementById('season').innerHTML = renderSaracensSeason(null);
      document.getElementById('standings').innerHTML = renderPremTable(null);
    });
  </script>
</body>
</html>
